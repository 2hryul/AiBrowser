# 정산 ↔ 회계 일별 대사.
#
# 자유 조작(스레드)으로 한 번 성공한 절차를 승격 UI 로 뽑아 낸 뒤 사람이 오라클을 붙인 것이다.
# 여기에 `prompt:` 는 없다. 같은 날짜를 넣으면 언제나 같은 판정이 나와야 골든셋이 의미를 갖는다.
#
# 오라클 5개를 붙였다(최소 3개). 넷은 `fail`, 하나는 `review` 다:
#   - 합계·짝·금액은 어긋나면 틀린 것이다 → fail
#   - 매칭률이 1.0 미만이면 퍼지 매칭이 끼었다는 뜻이다 → review (사람이 봐야 한다)
# 겹치게 붙인 이유는 미탐을 막기 위해서다. 합계만 보면 서로 상쇄되는 두 오류를 놓친다.

id: settle_vs_ledger_daily
version: 1
description: 하루치 정산 내역과 회계 전표를 대사한다. 금액 차이·한쪽 누락·식별자 오타를 잡는다.

inputs:
  date:
    type: date
    required: true
    description: 대사할 영업일 (YYYY-MM-DD)

steps:
  # ── 수집: 사다리 상단부터 ──
  - id: fetch_settle
    adapter: portal_settle_daily
    with:
      date: '${inputs.date}'
    as: settle
    retry:
      max: 1
      delayMs: 300

  - id: fetch_ledger
    adapter: portal_ledger_daily
    with:
      date: '${inputs.date}'
    as: ledger
    retry:
      max: 1
      delayMs: 300

  # ── 정규화: 쉼표·대소문자·구분자 때문에 멀쩡한 짝이 어긋나지 않게 ──
  - id: normalize_settle
    op: normalize
    with:
      rows: '${settle}'
      fields:
        txId: id
        amount: amount
        date: date
    as: settle_n

  - id: normalize_ledger
    op: normalize
    with:
      rows: '${ledger}'
      fields:
        txId: id
        amount: amount
        date: date
    as: ledger_n

  # ── 대사: 정확 → 허용오차 → 퍼지(거리 1). 퍼지는 매칭이지만 언제나 review 표시가 붙는다 ──
  - id: match
    op: reconcile
    with:
      left: '${settle_n}'
      right: '${ledger_n}'
      key: txId
      amountField: amount
      tolerance: 0
      fuzzyDistance: 1
    as: recon

  # ── 합계: 규칙이 목록을 다루지 않게 스칼라로 꺼내 둔다 ──
  - id: total_settle
    op: aggregate
    with:
      rows: '${settle_n}'
      field: amount_n
      fn: sum
    as: settle_total

  - id: total_ledger
    op: aggregate
    with:
      rows: '${ledger_n}'
      field: amount_n
      fn: sum
    as: ledger_total

outputs:
  settleRows: recon.counts.left
  ledgerRows: recon.counts.right
  exact: recon.counts.exact
  fuzzy: recon.counts.fuzzy
  settleTotal: settle_total
  ledgerTotal: ledger_total
  onlyLeftRows: recon.onlyLeft
  onlyRightRows: recon.onlyRight
  mismatchedRows: recon.mismatched
  matches: recon.matches

oracles:
  - rule: sum_equal
    args:
      left: settle_total
      right: ledger_total
      tolerance: 0
    severity: fail
    note: 하루 정산 합계와 전표 합계는 원 단위까지 같아야 한다

  - rule: empty
    args:
      target: recon.onlyLeft
    severity: fail
    note: 정산에 있는데 전표가 없는 거래

  - rule: empty
    args:
      target: recon.onlyRight
    severity: fail
    note: 전표만 있고 정산 내역이 없는 거래

  - rule: empty
    args:
      target: recon.mismatched
    severity: fail
    note: 짝은 찾았지만 금액이 허용오차를 벗어난 거래

  - rule: ratio_gte
    args:
      numerator: recon.counts.exact
      denominator: recon.counts.left
      min: 1
    severity: review
    note: 거래번호가 정확히 일치하지 않은 건이 있다 — 퍼지 매칭 결과를 사람이 확인해야 한다

evidence:
  screenshots: true
  raw: true
